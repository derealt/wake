[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wake-agent"
version = "0.1.0"
description = "An AI agent can only destroy what it made. When you stop it, everything it made stops with it."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["relate-db>=1.0.1"]
keywords = ["ai-agents", "safety", "relate", "graph", "neo4j", "kill-switch"]
classifiers = ["Operating System :: POSIX :: Linux", "Programming Language :: Python :: 3"]

[project.scripts]
wake = "wake.cli:main"

[tool.setuptools.packages.find]
include = ["wake*"]

[tool.setuptools.package-data]
wake = ["view/*"]
